<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F9F7F3" />
    <meta name="api-base-url" content="" />
    <title>Choose a username — Life Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="topbar">
      <div class="brand-group">
        <span class="index-tag">ACCOUNT SETUP</span>
        <span class="brand-title">LIFELOG</span>
      </div>
    </div>
    <main class="auth-view">
      <form class="auth-panel" id="username-form">
        <p class="index-tag">ONE LAST STEP</p>
        <h1>Choose a username</h1>
        <p class="form-copy">Pick the name you’ll use on LifeLog. You can use letters, numbers, and @/./+/-/_ characters.</p>
        <label>Username<input id="username" name="username" autocomplete="username" maxlength="150" autofocus required /></label>
        <p class="form-error" id="username-error" role="alert"></p>
        <button class="log-entry-button form-submit" type="submit">CONTINUE</button>
      </form>
    </main>
    <script type="module" src="./username.js"></script>
  </body>
</html>
